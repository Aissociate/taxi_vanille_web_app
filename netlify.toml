# Deploiement AUTOMATIQUE depuis GitHub (Netlify).
# Objectif : remplacer le deploy Bolt qui ne suit pas `main`. Une fois le depot
# Aissociate/taxi_vanille_web_app connecte dans Netlify, CHAQUE push sur `main`
# reconstruit et deploie web/ automatiquement. GitHub redevient la source unique.
#
# Rien a configurer d'autre : build + variables publiques ci-dessous.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
